<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Controller</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif;
               background: #1b2a3a; color: #fff; }
  #status { position: absolute; top: 0; left: 0; right: 0; padding: 10px; text-align: center;
            font-weight: 700; font-size: 20px; background: var(--c, #555); }
  .pad { position: absolute; inset: 50px 0 0 0; display: flex; align-items: center; justify-content: space-around; }
  .dpad { display: grid; grid-template: repeat(3, 70px) / repeat(3, 70px); }
  .dpad button[data-b="U"] { grid-area: 1 / 2; } .dpad button[data-b="L"] { grid-area: 2 / 1; }
  .dpad button[data-b="R"] { grid-area: 2 / 3; } .dpad button[data-b="D"] { grid-area: 3 / 2; }
  .ab { display: grid; grid-template: 90px 90px / 90px 90px; gap: 10px; }
  .ab button[data-b="A"] { grid-area: 1 / 2; border-radius: 50%; } .ab button[data-b="B"] { grid-area: 2 / 1; border-radius: 50%; }
  button { border: 0; border-radius: 12px; background: #3a4d63; color: #fff; font-size: 28px; font-weight: 700; }
  button.down { background: var(--c, #888); }
  #nameForm { position: absolute; inset: 50px 0 0 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 16px; background: #1b2a3a; }
  #nameForm input { font-size: 24px; padding: 12px; width: 260px; border-radius: 12px; border: 4px solid var(--c, #888);
                    text-align: center; -webkit-user-select: text; user-select: text; }
  #nameForm button { padding: 14px 40px; background: var(--c, #888); }
  [hidden] { display: none !important; }
  @media (orientation: portrait) {
    .pad { flex-direction: column; justify-content: space-evenly; }
  }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div class="pad" id="pad" hidden>
  <div class="dpad">
    <button data-b="U" aria-label="Up">▲</button><button data-b="L" aria-label="Left">◀</button>
    <button data-b="R" aria-label="Right">▶</button><button data-b="D" aria-label="Down">▼</button>
  </div>
  <div class="ab">
    <button data-b="A">A</button><button data-b="B">B</button>
  </div>
</div>
<form id="nameForm" hidden>
  <label for="name">Your name</label>
  <input id="name" maxlength="12" autocomplete="off" required>
  <button>Join</button>
</form>

<script src="/socket.io/socket.io.js"></script>
<script>
  const status = document.getElementById('status');
  const pad = document.getElementById('pad');
  const form = document.getElementById('nameForm');
  const nameInput = document.getElementById('name');

  // A stable id per phone, so a refresh or screen unlock gets the same slot back.
  let pid = localStorage.getItem('pid');
  if (!pid) localStorage.setItem('pid', pid = crypto.randomUUID?.() || String(Math.random()).slice(2) + Date.now());
  const socket = io({ query: { role: 'phone', pid } });

  const releaseAll = () => document.querySelectorAll('button.down').forEach(b => b.classList.remove('down'));

  socket.on('joined', ({ slot, color, name }) => {
    document.body.style.setProperty('--c', color);
    status.textContent = name ? `${name} (P${slot + 1})` : `You are P${slot + 1}`;
    form.hidden = !!name;
    pad.hidden = !name;
    if (!name) nameInput.focus();
  });
  socket.on('full', () => status.textContent = 'Game is full (4 players)');
  socket.on('kicked', () => { status.textContent = 'Removed by host – refresh to join again'; pad.hidden = form.hidden = true; });
  socket.on('disconnect', (reason) => {
    releaseAll();
    if (reason !== 'io server disconnect') status.textContent = 'Reconnecting…';
  });
  // Phones kill sockets when the screen locks; reconnect as soon as the page is visible again.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !socket.connected && status.textContent === 'Reconnecting…') socket.connect();
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    nameInput.blur();
    socket.emit('name', nameInput.value);
  });

  pad.querySelectorAll('button').forEach(btn => {
    const send = (down) => (e) => {
      e.preventDefault();
      if (btn.classList.contains('down') === down) return;
      btn.classList.toggle('down', down);
      socket.emit('btn', { b: btn.dataset.b, down });
    };
    btn.addEventListener('pointerdown', send(true));
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, send(false)));
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
